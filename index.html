<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Information - M/S PATHAN MOTORS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .main-wrapper {
      flex: 1;
      padding: 25px 15px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    /* হেডার ডিজাইন */
    .header-section {
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 2px solid #eaedf3;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }
    .header-logo {
      height: 75px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
    }
    .header-title-box h1 {
      margin: 0;
      color: #d90429;
      font-size: 24px;
      letter-spacing: 0.5px;
    }
    .header-title-box h3 {
      margin: 4px 0 0;
      color: #2b2d42;
      font-size: 16px;
      font-weight: 600;
    }
    /* ইনপুট কনফিগ গ্রিড */
    .config-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .config-grid { grid-template-columns: 1fr; }
    }
    .config-box {
      background: #fdf2f2;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #fecaca;
    }
    .config-box label {
      font-weight: bold;
      font-size: 13px;
      color: #333;
      display: block;
      margin-bottom: 6px;
    }
    .config-box input {
      width: 100%;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    /* আপলোড বক্স */
    .upload-zone {
      border: 2px dashed #d90429;
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      background: #fffafa;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s;
    }
    .upload-zone:hover {
      background: #fff1f1;
    }
    .upload-zone input { display: none; }
    .preview-box img {
      max-width: 180px;
      max-height: 180px;
      border-radius: 6px;
      margin-top: 10px;
      border: 1px solid #ddd;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-process { background: #d90429; color: #fff; }
    .btn-copy { background: #0f9d58; color: #fff; display: none; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    #status {
      margin: 15px 0;
      font-weight: bold;
      font-size: 14px;
    }
    .loading { color: #d97706; }
    .success { color: #0f9d58; }
    .error { color: #d93025; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: left;
      font-size: 14px;
      text-transform: uppercase;
    }
    th { background-color: #f8fafc; color: #475569; }
    tr:nth-child(even) { background-color: #f9fbfd; }
    /* ফুটার ডিজাইন */
    footer {
      background: #1e293b;
      color: #f8fafc;
      padding: 15px 20px;
      text-align: center;
      font-size: 13px;
      margin-top: auto;
    }
    footer a {
      color: #60a5fa;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="container">
    <!-- হেডার অংশ -->
    <div class="header-section">
      <img src="logo.png" alt="Pathan Motors Logo" class="header-logo" onerror="this.style.display='none'">
      <div class="header-title-box">
        <h1>M/S PATHAN MOTORS</h1>
        <h3>Product Information System</h3>
      </div>
    </div>

    <!-- কনফিগারেশন গ্রিড: API Key এবং Unique Code -->
    <div class="config-grid">
      <div class="config-box">
        <label for="apiKey">Google Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="AIzaSy..." onchange="saveKey()">
        <small style="color: #666; display:block; margin-top: 4px;">
          * API KEY পেতে Click করুন ► (<a href="https://aistudio.google.com/app/apikey" target="_blank">API KEY</a>)
        </small>
      </div>
      <div class="config-box">
        <label for="startCode">Unique Starting Code:</label>
        <input type="text" id="startCode" placeholder="e.g. 1001 ">
        <small style="color: #666; display:block; margin-top: 4px;">
          * প্রথম আইটেমের বারকোডের কোড
        </small>
      </div>
    </div>

    <!-- ইমেজ আপলোড অংশ -->
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
      <strong>ছবি সিলেক্ট করুন বা এখানে ড্রপ করুন</strong>
      <p style="margin: 5px 0 0; color: #777; font-size: 13px;">হাতের লেখা ইনভয়েস বা খাতার স্পষ্ট ছবি দিন</p>
      <div class="preview-box" id="previewBox"></div>
    </div>

    <!-- অ্যাকশন বাটন -->
    <div style="display: flex; gap: 10px;">
      <button id="processBtn" class="btn btn-process" onclick="processImage()" disabled>⚡ Auto Extract Data</button>
      <button id="copyBtn" class="btn btn-copy" onclick="copyForSheet()">📋 Copy for Google Sheets</button>
    </div>

    <div id="status"></div>

    <!-- এক্সট্রাক্ট করা ডেটা টেবিল: GROUP | DESCRIPTION | BARCODE -->
    <table id="resultTable" style="display:none;">
      <thead>
        <tr>
          <th style="width: 20%;">GROUP</th>
          <th>DESCRIPTION</th>
          <th style="width: 25%;">BARCODE</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- ফুটার অংশ -->
<footer>
  Developed by <b>Dip Raha</b> | Email: <a href="mailto:dipraha7@gmail.com">dipraha7@gmail.com</a> | Cell: <a href="tel:01910226680">01910226680</a>
</footer>

<script>
  let base64Image = null;
  let extractedRows = [];

  window.onload = function() {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
    }
  };

  function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('gemini_api_key', key);
  }

  function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const fullBase64 = e.target.result;
      base64Image = fullBase64.split(',')[1];
      
      document.getElementById('previewBox').innerHTML = `<img src="${fullBase64}" alt="Preview">`;
      document.getElementById('processBtn').disabled = false;
      document.getElementById('status').innerText = '';
    };
    reader.readAsDataURL(file);
  }

  function getNextCode(currentCode, step) {
    const str = String(currentCode).trim();
    const match = str.match(/^(.*?)(\d+)$/);
    if (!match) {
      return str + step;
    }
    const prefix = match[1];
    const numPart = match[2];
    const nextNum = parseInt(numPart, 10) + step;
    return prefix + String(nextNum).padStart(numPart.length, '0');
  }

  async function processImage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
      alert("দয়া করে উপরে আপনার Gemini API Key দিন!");
      return;
    }
    saveKey();

    if (!base64Image) {
      alert("অনুগ্রহ করে একটি ছবি সিলেক্ট করুন!");
      return;
    }

    const startCodeInput = document.getElementById('startCode').value.trim() || '1001';

    const status = document.getElementById('status');
    const processBtn = document.getElementById('processBtn');
    status.className = 'loading';
    status.innerText = 'স্বয়ংক্রিয়ভাবে হাতের লেখা পড়ে ডেটা প্রসেস হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...';
    processBtn.disabled = true;

    const prompt = `
You are an expert handwritten auto-parts invoice parser.
Read the table in the image row by row. If there are ditto marks (' ' or -) repeating previous rows, fill in the correct values.

CRITICAL INSTRUCTIONS:
1. STRICTLY CONVERT ANY BENGALI WORDS/LETTERS INTO ENGLISH CHARACTERS (e.g. transliterate/translate to UPPERCASE English). No Bengali characters.
2. ALL TEXT OUTPUT MUST BE STRICTLY UPPERCASE.
3. Extract 'group', 'brand', and the 'formatted_description'.

Format each row as a raw JSON array of objects:
[
  {
    "group": "GROUP NAME",
    "brand": "BRAND NAME",
    "formatted_description": "BRAND NAME - DESCRIPTION (LOCAL LANGUAGE) - CAR DETAILS"
  }
]

Rule for "formatted_description":
- Format MUST be: BRAND - DESCRIPTION (LOCAL LANGUAGE) - CAR DETAILS
- If LOCAL LANGUAGE is present, wrap it in brackets: (LOCAL LANGUAGE).
- If LOCAL LANGUAGE is NOT present (empty or dash), DO NOT include brackets: BRAND - DESCRIPTION - CAR DETAILS.

Return ONLY valid raw JSON without markdown or backticks.
`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: "image/jpeg", data: base64Image } }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      let rawText = data.candidates[0].content.parts[0].text.trim();
      if (rawText.startsWith('```')) {
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      }

      const parsed = JSON.parse(rawText);

      extractedRows = parsed.map((r, index) => {
        const groupStr = (r.group || 'GRP').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        const brandStr = (r.brand || 'BRD').replace(/[^A-Za-z0-9]/g, '').toUpperCase();

        const g3 = (groupStr.padEnd(3, 'X')).substring(0, 3);
        const b3 = (brandStr.padEnd(3, 'X')).substring(0, 3);
        const uniqueCode = getNextCode(startCodeInput, index).toUpperCase();

        const barcode = `${g3}${b3}${uniqueCode}`;

        return {
          group: (r.group || '').toUpperCase(),
          formatted_description: (r.formatted_description || '').toUpperCase(),
          barcode: barcode
        };
      });

      renderTable(extractedRows);

      status.className = 'success';
      status.innerText = `সফলভাবে ${extractedRows.length} টি আইটেম তৈরি হয়েছে!`;
      document.getElementById('copyBtn').style.display = 'inline-flex';
    } catch (err) {
      console.error(err);
      status.className = 'error';
      status.innerText = 'সমস্যা হয়েছে: ' + err.message;
    } finally {
      processBtn.disabled = false;
    }
  }

  function renderTable(rows) {
    const table = document.getElementById('resultTable');
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    rows.forEach(r => {
      const tr = document.createElement('tr');
      // নতুন কলাম বিন্যাস: GROUP | DESCRIPTION | BARCODE
      tr.innerHTML = `<td>${r.group}</td><td>${r.formatted_description}</td><td><b>${r.barcode}</b></td>`;
      tbody.appendChild(tr);
    });

    table.style.display = 'table';
  }

  // গুগল শিটে পেস্ট করার ফরম্যাট: GROUP \t DESCRIPTION \t BARCODE
  function copyForSheet() {
    if (extractedRows.length === 0) return;

    let tsv = "";
    extractedRows.forEach(r => {
      tsv += `${r.group}\t${r.formatted_description}\t${r.barcode}\n`;
    });

    navigator.clipboard.writeText(tsv).then(() => {
      const copyBtn = document.getElementById('copyBtn');
      const originalText = copyBtn.innerHTML;
      copyBtn.innerHTML = '✅ Copied Data Only!';
      setTimeout(() => { copyBtn.innerHTML = originalText; }, 2000);
    });
  }
</script>

</body>
</html>
